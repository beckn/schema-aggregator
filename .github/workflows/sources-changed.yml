name: Sources changed (automatic)

on:
  push:
    branches: [main]
    paths:
      - 'sources.yaml'

permissions:
  contents: write
  issues: write

concurrency:
  group: sources-changed
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregator repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Sync new sources, clean up removed ones
        id: sync_new
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          VALIDATION_REPORT_PATH: /tmp/validation-report.md
          STATUS_REPORT_PATH: /tmp/status-report.md
        run: python3 .github/scripts/sources_changed.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "meaningful=$(bash .github/scripts/has_meaningful_change.sh)" >> "$GITHUB_OUTPUT"
            git commit -m "sources-changed: sync new sources / clean up removed ones"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger schema-browser rebuild
        if: steps.commit.outputs.pushed == 'true' && steps.commit.outputs.meaningful == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCHEMA_BROWSER_DISPATCH_TOKEN }}
        run: |
          gh api repos/beckn/schema-browser/dispatches \
            -f event_type=schema-aggregator-updated \
            -F "client_payload[sha]=${{ github.sha }}"

      - name: Update validation tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_FAILURES: ${{ steps.sync_new.outputs.has_failures }}
          VALIDATION_REPORT_PATH: /tmp/validation-report.md
        run: bash .github/scripts/update_tracking_issue.sh

      - name: Update repo status issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_REPORT_PATH: /tmp/status-report.md
        run: bash .github/scripts/update_status_issue.sh
